<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Card - DevOps Bootcamp 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
  }

  .card {
    max-width: 340px;
    padding: 2rem;
    background: #ffffff;
    border-radius: 1.25rem;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    opacity: 0;
    animation: fadeIn 1s ease-out forwards;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }

  .badge {
    display: inline-block;
    padding: 0.35rem 1rem;
    margin-bottom: 1.25rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #fff;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    animation: pulse 2.5s ease-in-out infinite;
  }

  h1 { font-size: 1.5rem; color: #0f172a; margin-bottom: 0.35rem; }
  .cohort { font-weight: 600; color: #6366f1; margin-bottom: 0.75rem; }
  .role { color: #64748b; font-size: 0.95rem; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.5); }
    50%      { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(236, 72, 153, 0); }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">DEVOPS BOOTCAMP 2026</span>
    <h1>Hanif Faez</h1>
    <p class="cohort">Cohort 4 · Terraform</p>
    <p class="role">DevOps Engineering Student</p>
  </div>
</body>
</html>
