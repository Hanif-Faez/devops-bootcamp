- name: Besarkan partition dan filesystem
  hosts: nodes
  become: true
  vars:
    site_title: Armada Infratify
    site_owner: Pasukan Platform
    web_port: 80
  tasks:
    - name: Besarkan partition
      command:
        - growpart
        - /dev/nvme0n1
        - 1
      register: partition_grow
      changed_when: partition_grow.rc == 0
      failed_when: partition_grow.rc == 2

    - name: Besarkan filesystem
      command:
        - resize2fs
        - /dev/nvme0n1p1
      register:
        filesystem_grow 
      changed_when:
        filesystem_grow.stdout != "" 